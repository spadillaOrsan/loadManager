<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../wwwroot/app.css" />
<style>
  html, body { margin: 0; padding: 0; }
  /* Layout angosto (<641px): columna, sin sidebar lateral fijo */
  .page { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: linear-gradient(90deg,#0f172a,#111827); height: 44px; flex: none; }
  main { flex: 1; min-width: 0; }
  article.content { padding-top: 1.1rem; }
  .px-4 { padding-left: 1.5rem; padding-right: 1.5rem; }
  .console-shell { outline: 2px dashed #ff3b3b; }
</style>
</head>
<body class="theme-dark">
  <div class="page theme-dark">
    <div class="topbar"></div>
    <main>
      <article class="content px-4">
        <section class="console-shell">
          <section class="authorization-panel">
            <div class="panel-heading"><h2>Surtiendo</h2><span>Estatus Surtiendo</span></div>
            <div class="liters-display" aria-live="polite">
              <span class="live-counter-status">Surtiendo</span>
              <span>Importe surtido</span>
              <strong><span class="live-currency-symbol">$</span>9,990.00</strong>
              <div class="live-secondary-counter">
                <span>Litros equivalentes</span>
                <strong>9,990.00<span class="live-counter-unit">Lt</span></strong>
              </div>
            </div>
          </section>
        </section>
      </article>
    </main>
  </div>
</body>
</html>
