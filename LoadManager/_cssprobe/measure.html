<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../wwwroot/app.css" />
<style>
  html, body { margin: 0; padding: 0; }
  .page { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: #111827; height: 44px; flex: none; }
  main { flex: 1; min-width: 0; }
  article.content { padding-top: 1.1rem; }
  .px-4 { padding-left: 1.5rem; padding-right: 1.5rem; }
  #report { background:#fff; color:#000; font:bold 20px monospace; padding:8px; white-space:pre; position:relative; z-index:5; }
</style>
</head>
<body class="theme-dark">
  <div id="report">midiendo...</div>
  <div class="page theme-dark">
    <div class="topbar"></div>
    <main>
      <article class="content px-4">
        <section class="console-shell">
          <section class="authorization-panel">
            <div class="panel-heading"><h2>Surtiendo</h2><span>Estatus</span></div>
            <div class="liters-display" id="ld" aria-live="polite">
              <span class="live-counter-status">Surtiendo</span>
              <span>Importe surtido</span>
              <strong id="pri"><span class="live-currency-symbol">$</span>9,990.00</strong>
              <div class="live-secondary-counter">
                <span>Litros equivalentes</span>
                <strong id="sec">9,990.00<span class="live-counter-unit">Lt</span></strong>
              </div>
            </div>
          </section>
        </section>
      </article>
    </main>
  </div>
  <script>
    window.addEventListener('load', function(){
      var ld = document.getElementById('ld');
      var pri = document.getElementById('pri');
      var sec = document.getElementById('sec');
      var cs = getComputedStyle(pri);
      var csld = getComputedStyle(ld);
      var fs = parseFloat(cs.fontSize);
      var r = [
        'viewport.innerWidth=' + window.innerWidth,
        'liters-display clientW=' + ld.clientWidth + ' (content)',
        'primary fontSize=' + fs.toFixed(1) + 'px',
        'primary scrollW=' + pri.scrollWidth + ' offsetW=' + pri.offsetWidth,
        'primary em-width=' + (pri.scrollWidth/fs).toFixed(2) + 'em',
        'OVERFLOW pri=' + (pri.scrollWidth > ld.clientWidth),
        'secondary scrollW=' + sec.scrollWidth + ' fontSize=' + parseFloat(getComputedStyle(sec).fontSize).toFixed(1)
      ].join('\n');
      document.getElementById('report').textContent = r;
    });
  </script>
</body>
</html>
