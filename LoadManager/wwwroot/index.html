<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>UAAC</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="LoadManager.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.uaacPrintTicket = function () {
            const ticket = document.querySelector(".ticket-panel");
            if (!ticket) {
                throw new Error("No se encontro el ticket en pantalla.");
            }

            const ticketHtml = ticket.cloneNode(true);
            const actions = ticketHtml.querySelector(".ticket-actions");
            if (actions) {
                actions.remove();
            }

            const frame = document.createElement("iframe");
            frame.style.position = "fixed";
            frame.style.right = "0";
            frame.style.bottom = "0";
            frame.style.width = "0";
            frame.style.height = "0";
            frame.style.border = "0";
            document.body.appendChild(frame);

            const doc = frame.contentWindow.document;
            doc.open();
            doc.write(`
                <!doctype html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <style>
                        body { color: #111; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 10px; }
                        .ticket-panel { display: grid; gap: 10px; width: 100%; }
                        .liters-display { display: none; }
                        .ticket-folio { border-bottom: 1px dashed #999; padding: 8px 0; text-align: center; }
                        .ticket-folio span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; }
                        .ticket-folio strong { display: block; font-size: 24px; }
                        .ticket-grid { display: grid; gap: 6px; }
                        .ticket-grid div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #ddd; padding: 4px 0; }
                        .ticket-grid span { font-size: 11px; font-weight: 700; text-transform: uppercase; }
                        .ticket-grid strong { font-size: 13px; text-align: right; }
                    </style>
                </head>
                <body>${ticketHtml.outerHTML}</body>
                </html>`);
            doc.close();

            frame.contentWindow.focus();
            frame.contentWindow.print();
            setTimeout(() => frame.remove(), 1000);
        };

        // Imprime un documento HTML completo abriendo el dialogo de impresion del
        // sistema (permite ELEGIR la impresora). Funciona en Windows (WebView2) y en
        // Android (el WebView lo enruta al framework de impresion con selector).
        window.uaacPrintHtml = function (html) {
            const frame = document.createElement("iframe");
            frame.style.position = "fixed";
            frame.style.right = "0";
            frame.style.bottom = "0";
            frame.style.width = "0";
            frame.style.height = "0";
            frame.style.border = "0";
            document.body.appendChild(frame);

            const doc = frame.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();

            frame.contentWindow.focus();
            frame.contentWindow.print();
            setTimeout(() => frame.remove(), 1500);
        };

        window.uaacHideKeyboardOnEnter = function () {
            if (window.__uaacKeyboardHandlerAttached) {
                return;
            }

            window.__uaacKeyboardHandlerAttached = true;
            document.addEventListener("keydown", function (event) {
                if (event.key !== "Enter" && event.keyCode !== 13) {
                    return;
                }

                const active = document.activeElement;
                if (!active || !["INPUT", "TEXTAREA"].includes(active.tagName)) {
                    return;
                }

                event.preventDefault();
                active.blur();
            }, true);
        };

        // El scroll real vive en "article.content" (el shell de la app es fijo, ver
        // MainLayout.razor.css), asi que el boton "subir arriba" scrollea ese panel,
        // no la ventana.
        window.uaacScrollContentToTop = function () {
            var content = document.querySelector("article.content");
            if (content) {
                content.scrollTo({ top: 0, behavior: "smooth" });
            }
        };

        // Muestra el boton "subir arriba" solo cuando el scroll paso la mitad del
        // contenido. Recalcula en "resize" ademas de "scroll" porque en distintos
        // dispositivos/orientaciones cambia cuanto mide el scroll disponible.
        function uaacUpdateScrollTopButtonVisibility() {
            var content = document.querySelector("article.content");
            var button = document.querySelector(".scroll-top-button");
            if (!content || !button) {
                return;
            }

            var maxScroll = content.scrollHeight - content.clientHeight;
            var pastHalf = maxScroll > 0 && content.scrollTop >= maxScroll / 2;
            button.classList.toggle("is-visible", pastHalf);
        }

        window.uaacSetupScrollTopButton = function () {
            uaacUpdateScrollTopButtonVisibility();

            if (window.__uaacScrollTopHandlerAttached) {
                return;
            }

            var content = document.querySelector("article.content");
            if (!content) {
                return;
            }

            window.__uaacScrollTopHandlerAttached = true;
            content.addEventListener("scroll", uaacUpdateScrollTopButtonVisibility);
            window.addEventListener("resize", uaacUpdateScrollTopButtonVisibility);
        };
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
